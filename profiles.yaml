# Profile registry (spec §7.2). Loaded and validated once, at boot.
#
# Adding a spreadsheet is an edit to this file plus a share in Google Drive —
# no code changes — provided its shape is one of the three layouts in §7.1.
# A genuinely new shape needs a new layout module.
#
# Changing a `name` or an alias changes what Claude can be asked for, so treat
# those as a public interface.
#
# ${NAME} is read from the environment. The spreadsheet ids come from there
# because they are the only part of this file that differs per deployment: an id
# is not a secret — alone it opens nothing that has not been shared — but it is
# a permanent pointer at personal data, and a public clone has no reason to
# carry one. Everything else lives here, in git, in one copy.
#
# To run this against your own sheets: export TRAINING_SPREADSHEET_ID and
# STUDY_SPREADSHEET_ID (or just write the ids in place of the placeholders),
# share each spreadsheet with the service account's client_email, and check the
# tab names against the labels at the bottom of the Sheets window.

profiles:
  - name: training
    aliases: [workout, gym, тренування]
    layout: dated-block
    description: >
      Training log. Each session is a dated block: a date row followed by one
      row per exercise. Set notation is free-form text, typically
      weight x reps x sets (e.g. 80x8x3) for weighted exercises, or
      reps x sets (e.g. 8x3) for bodyweight exercises.
    spreadsheet_id: ${TRAINING_SPREADSHEET_ID}
    tab: Лист1
    date_column: A
    item_column: A
    value_columns: [B, C, D, E, F, G]
    # Both forms appear in the existing sheet (§7.5); only the four-digit form
    # is ever written back.
    date_formats: ["DD.MM.YYYY", "DD.MM.YY"]
    write_date_format: "DD.MM.YYYY"
    block_separator: blank-row

  - name: study
    aliases: [learning, навчання, habits]
    layout: grid
    description: >
      Monthly habit grid. One block per month, one row per day of that month,
      columns are activities. Durations are written as hours — 1h, 1.5h —
      rounded to the half hour. Blocks before 17 August 2026 use tally marks
      ("|" is an hour, "-" is thirty minutes); those are still read, and
      nothing rewrites them.
    spreadsheet_id: ${STUDY_SPREADSHEET_ID}
    tab: Лист1
    day_column: B
    period_header_offset: -2   # rows above the first day row
    label_row_offset: -1
    # Written as 1h / 1.5h from 17 August 2026. Existing tally cells
    # ("|" = 1h, "-" = 30m) are still read; nothing rewrites them.
    value_type: duration-hours
    duration_step: 0.5         # hours; inputs are rounded to this
    write_canonical: true      # emit "|-" not "| -"
    # The sheet's own month names, January first (§7.5). Not derived from a
    # locale: the container's locale is not this sheet's language.
    period_names: [Січень, Лютий, Березень, Квітень, Травень, Червень, Липень, Серпень, Вересень, Жовтень, Листопад, Грудень]
    columns:
      - key: programming
        label: Програмування
        aliases: [код, coding, dev]
      - key: reading
        label: Читання
      - key: english
        label: Англійська
      - key: czech
        label: Чеська
    note: >
      Column labels are NOT stable across months. Observed: May replaced
      Читання with Крипта; June replaced Англійська with "x". The label row
      must be read per block, never assumed from config.