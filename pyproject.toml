[project]
name = "sheets-mcp"
version = "0.1.0"
description = "Remote MCP server giving Claude read/write access to personal Google Sheets"
requires-python = ">=3.12"
dependencies = [
    # v2 of the official SDK. The API changed substantially from v1 (FastMCP was
    # renamed to MCPServer, transport options moved off the constructor), so the
    # major version is pinned rather than left open.
    "mcp>=2,<3",
    "uvicorn>=0.35",
    "structlog>=24.4",
    # pydantic arrives transitively via mcp, but profiles.yaml is validated with
    # it directly, so it is declared rather than depended on by accident.
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "google-auth>=2.35",
    "google-api-python-client>=2.150",
]

[dependency-groups]
dev = [
    "mcp[cli]>=2,<3",   # `mcp dev` inspector — laptop only, not installed on the VPS
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.8",
    # PyYAML ships no inline types, and without these `yaml.safe_load` is Any —
    # which quietly disables strict checking of everything downstream of it.
    "types-PyYAML>=6.0",
    # The Google client is generated at runtime from a discovery document, so it
    # has no types of its own. Without these, every `.spreadsheets().values()`
    # chain is Any and a typo in a method name type-checks perfectly.
    "google-api-python-client-stubs>=1.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheets_mcp"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
# So `tests.fakes` imports as a module rather than by whatever directory pytest
# happened to prepend. Without it the shared fake is only importable from some
# invocation directories, which is a confusing way to find out.
pythonpath = ["."]
markers = ["integration: hits a real spreadsheet; opt in with -m integration"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
